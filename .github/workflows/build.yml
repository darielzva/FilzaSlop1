name: Build Theos App/Tweak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Install Dependencies (ldid)
      run: |
        brew install ldid dpkg
      shell: bash

    - name: Build Project
      run: |
        export THEOS=~/theos
        make package
      shell: bash

    - name: Create Zip Archive
      run: |
        mkdir -p final_output
        cp -R packages/* final_output/ 2>/dev/null || true
        cd final_output && zip -r ../CompiledAppPackage.zip *
      shell: bash

    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-App-Zip
        path: CompiledAppPackage.zip

        
    - name: Create IPA from output
      run: |
        # Theos a veces genera una carpeta .app dentro de .theos/obj
        # Vamos a buscarla y convertirla a IPA
        mkdir -p Payload
        cp -r .theos/obj/debug/FilzaSlop.app Payload/
        zip -r FilzaSlop.ipa Payload/
      shell: bash
